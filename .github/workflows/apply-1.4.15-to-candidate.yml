name: Apply AI Akademie 1.4.15 to candidate
on:
  push:
    branches: [candidate]
    paths: ['.github/workflows/apply-1.4.15-to-candidate.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout canonical candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: candidate
          fetch-depth: 0

      - name: Verify candidate baseline and release source
        shell: bash
        run: |
          set -euo pipefail
          expected_parent="910ea4dfbcfef7950643c386d32c91de588a95a3"
          actual_parent="$(git rev-parse HEAD^)"
          test "$actual_parent" = "$expected_parent" || {
            echo "::error::candidate baseline moved: expected parent $expected_parent got $actual_parent"
            exit 1
          }
          git fetch origin candidate-1.4.15
          expected_release="c9f831b60938204eaeca00b7ecaa1d4b279b4033"
          actual_release="$(git rev-parse origin/candidate-1.4.15)"
          test "$actual_release" = "$expected_release" || {
            echo "::error::verified release branch moved: expected $expected_release got $actual_release"
            exit 1
          }

      - name: Apply verified release files
        shell: bash
        run: |
          set -euo pipefail
          release="c9f831b60938204eaeca00b7ecaa1d4b279b4033"
          files=(
            APP-ai-akademie-GARP.txt
            CURRENT-RELEASE-STATUS.md
            README.md
            RELEASE-NOTES-1.4.15.md
            assets/brand/apple-touch-icon.png
            assets/brand/icon-192.png
            assets/brand/icon-32.png
            assets/brand/icon-512-maskable.png
            assets/brand/icon-512.png
            assets/course-icons/administrator.png
            assets/course-icons/ai-literacy.png
            assets/course-icons/correspondence.png
            assets/course-icons/differentiator.png
            assets/course-icons/evaluator.png
            assets/course-icons/generator.png
            assets/course-icons/github.png
            assets/course-icons/ludus.png
            assets/course-icons/start.png
            assets/course-icons/workflow.png
            assets/js/changelog.js
            exports/administrator.html
            exports/ai-literacy.html
            exports/correspondence.html
            exports/differentiator.html
            exports/evaluator.html
            exports/generator.html
            exports/github.html
            exports/ludus.html
            exports/start.html
            exports/workflow.html
            package-lock.json
            package.json
            scripts/build-exports.mjs
            scripts/export-template/export-runtime.js
            scripts/export-template/export.css
            security/BINARY-RIGHTS-INVENTORY.txt
            security/garp27/application-migration-profile.json
            security/garp27/architecture-policy.json
            security/garp27/capability-inventory.json
            security/garp27/garp27-policy.json
            security/sbom/ai-akademie-1.4.15.cdx.json
            sw.js
          )
          git checkout "$release" -- "${files[@]}"

      - name: Build and test
        run: npm test

      - name: Verify all 42 release target blobs
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while read -r file expected; do
            got="$(git hash-object "$file")"
            if [ "$got" != "$expected" ]; then
              echo "::error file=$file::Git blob mismatch expected=$expected got=$got"
              failed=1
            else
              echo "OK $file $got"
            fi
          done <<'HASHES'
          assets/brand/apple-touch-icon.png 248589b192bc470804d21622bdda0e92db14e656
          assets/brand/icon-192.png 7e6dd7aa08478c07af6569dcc4967a579f427e97
          assets/brand/icon-32.png 373eed36e4db607f3b1c46b9caa09294ba3665ee
          assets/brand/icon-512-maskable.png 0171ae4f7ef6ea34ebf0a4de155472c64e3041ad
          assets/brand/icon-512.png fd5f14222b52aca1e48e87ccba77035d8433392a
          assets/course-icons/administrator.png 2da7dd3671917adc0b6e022a09e6d7d5a97a4f26
          assets/course-icons/ai-literacy.png c6d1c5616d3f04086591a242ff031d259e059607
          assets/course-icons/correspondence.png 55a9db06b831da3df9bcd5173517ab1724b22139
          assets/course-icons/differentiator.png 1fec2cb6fde63e6c96fe1d502b7fc72f977736c3
          assets/course-icons/evaluator.png b1e3e1f64fddf2160cf9ec020d880b288626a3d0
          assets/course-icons/generator.png b582c188161033f455edc698f1ecf3d46fe00c4f
          assets/course-icons/github.png 534d445fad372aef708e8102183874da9be23b60
          assets/course-icons/ludus.png 64425c226d80237e9fd289ad66681eee5ba78e30
          assets/course-icons/start.png fc0abe42411db6b6de827b3caca964060573a0fc
          assets/course-icons/workflow.png 1068116bf7f5667be70b6ac324afd99d324fbd86
          scripts/build-exports.mjs f0a1052a8bfe30f22e5bf829cab491d5661f5d03
          scripts/export-template/export.css 173f3c9405bf4dbcee2268c749c99b1f3a2f9872
          scripts/export-template/export-runtime.js 9be315b2899708fb86e46f74a13e3b3628142488
          exports/administrator.html 5a1e20c5007c92d82347bf6d6b9b15dab7636fce
          exports/ai-literacy.html f79c3775235cb1a4efffb791b3c95a72d772a4db
          exports/correspondence.html 0158da8c362f301a894629779273917cd315641a
          exports/differentiator.html a37b9c51b497082034c4f92c8e0ebf0c012d4e39
          exports/evaluator.html be2dd5d6ad051bcefb36563f6f58f87dae3081de
          exports/generator.html 3b53eb710cdf2d766981f7150dbe66252b17dc5e
          exports/github.html e5d1a4e65a658f0fb1ddf6f73f71751f76c32112
          exports/ludus.html 76fed8e1d90d85fe80dd3e091b1d0033b6229efb
          exports/start.html fde04c28758f41b64a953a0f282bcdde98625d78
          exports/workflow.html 7ae724a27403e100d109d159489edde51400fc98
          package.json fc5ceec9f4ee8441ef49c96e44a2302a5f033f53
          package-lock.json f79e79e146726ade10bb4968224cb6fc2487b138
          sw.js 47ccf72c326e60acd09f3306b827503c08405f63
          assets/js/changelog.js f9baef98d0abe64177cd98b52cb85b5af1354379
          README.md d4b3441588d12ce4904bd529ac7de418d27125f2
          CURRENT-RELEASE-STATUS.md 7dadaa6c82112f0a0b038e5bbe78a5682611bc11
          APP-ai-akademie-GARP.txt 04bc354804dac6d578b98a876072c1d25109605f
          security/garp27/application-migration-profile.json b12313f0d8b28eb6f970f117898c7f5a96ac18a2
          security/garp27/architecture-policy.json 0fb209a4f076b0e2125c4c065de6b8c5cb869f28
          security/garp27/capability-inventory.json eb3395412f5f836f82cfdb60b3824af02b4e7b69
          security/garp27/garp27-policy.json 51774644489fbe1aedb88c2b299c8f552f68b83e
          RELEASE-NOTES-1.4.15.md ff60444f25c59a0a03bec46cd3115a6a0983ac47
          security/sbom/ai-akademie-1.4.15.cdx.json 1507abc650ea8b124d0a24cc6e47623c25558dd1
          security/BINARY-RIGHTS-INVENTORY.txt a984a3d03827e0b9eabf9ac24afcd5be7fb87200
          HASHES
          if [ "$failed" -ne 0 ]; then exit 1; fi

      - name: Commit verified 1.4.15 to canonical candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-1.4.15-to-candidate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "release: AI Akademie 1.4.15"
          git push origin HEAD:candidate
