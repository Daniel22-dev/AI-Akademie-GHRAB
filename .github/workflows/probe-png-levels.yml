name: Probe normalized release hashes
on:
  push:
    branches: [candidate-1.4.15]
    paths: ['.github/workflows/probe-png-levels.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: candidate-1.4.15
          fetch-depth: 0

      - name: Reconstruct audited text payload
        shell: bash
        run: |
          set -euo pipefail
          cat .release-upload/tp.* | base64 -d > /tmp/akademie-text-payload.tar.gz
          echo "07fe5eb5f02c85a3bbbe0ea4f5a25d04eb76116fcb68524b43eddc42d3822046  /tmp/akademie-text-payload.tar.gz" | sha256sum -c -
          tar -xzf /tmp/akademie-text-payload.tar.gz -C .

      - run: cargo install oxipng --version 10.2.1 --locked

      - name: Reproduce deterministic PNG encodings
        shell: bash
        run: |
          set -euo pipefail
          level4=(
            assets/brand/icon-192.png
            assets/brand/icon-32.png
            assets/brand/icon-512.png
            assets/course-icons/administrator.png
            assets/course-icons/correspondence.png
            assets/course-icons/differentiator.png
            assets/course-icons/evaluator.png
            assets/course-icons/github.png
            assets/course-icons/ludus.png
            assets/course-icons/start.png
          )
          level5=(
            assets/brand/apple-touch-icon.png
            assets/brand/icon-512-maskable.png
            assets/course-icons/ai-literacy.png
            assets/course-icons/generator.png
            assets/course-icons/workflow.png
          )
          for f in "${level4[@]}"; do oxipng -q -o 4 "$f"; done
          for f in "${level5[@]}"; do oxipng -q -o 5 "$f"; done

      - name: Build and test
        run: npm test

      - name: Print normalized hashes
        shell: bash
        run: |
          set -euo pipefail
          for f in             assets/course-icons/ai-literacy.png             assets/course-icons/workflow.png             exports/ai-literacy.html             exports/workflow.html
          do
            echo "NORMALIZED_HASH $f $(git hash-object "$f")"
          done
