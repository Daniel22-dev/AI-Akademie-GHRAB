name: AUTO PATCH

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Describe the defect to fix. Keep scope narrow."
        required: true
        type: string
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: auto-patch-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  patch:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'auto-patch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AUTO_PATCH_MODEL: gpt-5.6-terra
      AUTO_PATCH_MAX_FILES: "30"
      AUTO_PATCH_MAX_CHANGED_LINES: "4000"
      AUTO_PATCH_MAX_CONTEXT_BYTES: "1000000"
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Establish clean trusted baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout --detach origin/main
          npm test
          npm run build:school-server
          npm run qa:secrets
          npm run qa:garp25:sw
          npm run qa:garp25:vendored
          npm run qa:garp25:sbom
          git reset --hard origin/main
          git clean -fd -e node_modules

      - name: Prepare authorized patch task
        id: task
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TASK: ${{ inputs.task }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const eventName = process.env.EVENT_NAME;
          let task = '';
          if (eventName === 'workflow_dispatch') {
            task = process.env.DISPATCH_TASK || '';
          } else {
            const number = process.env.ISSUE_NUMBER || '';
            const title = process.env.ISSUE_TITLE || '';
            const body = process.env.ISSUE_BODY || '';
            task = `Authorized GitHub issue #${number}\nTitle: ${title}\n\n${body}`;
          }
          task = task.trim();
          if (!task) throw new Error('AUTO PATCH task is empty');
          if (task.length > 20000) throw new Error('AUTO PATCH task exceeds 20,000 characters');
          const file = `${process.env.RUNNER_TEMP}/auto-patch-task.txt`;
          writeFileSync(file, task + '\n', 'utf8');
          writeFileSync(process.env.GITHUB_OUTPUT, `task_file=${file}\n`, { flag: 'a' });
          NODE

      - name: Create isolated patch branch
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "issues" ]; then
            suffix="issue-${{ github.event.issue.number }}-${{ github.run_id }}"
          else
            suffix="manual-${{ github.run_id }}"
          fi
          branch="auto-patch/${suffix}"
          git switch -c "$branch" origin/main
          printf 'branch=%s\n' "$branch" >> "$GITHUB_OUTPUT"

      - name: Generate constrained patch
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AUTO_PATCH_TASK_FILE: ${{ steps.task.outputs.task_file }}
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: node scripts/auto-patch-worker.mjs

      - name: Reject protected-path changes before tests
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const files = execFileSync('git', ['diff', '--name-only', '-z'], { encoding: 'utf8' }).split('\0').filter(Boolean);
          if (!files.length) throw new Error('AUTO PATCH produced no worktree changes');
          const protectedPath = p =>
            p.startsWith('.github/') || p.startsWith('security/') || p.startsWith('scripts/') ||
            p.startsWith('dist/') || p.startsWith('dist-school-server/') || p === 'package.json' || p === 'package-lock.json' ||
            /(^|\/)\.env(?:\.|$)/i.test(p) || /\.(pem|key|p12|pfx|jks|keystore)$/i.test(p) ||
            /\.(zip|7z|rar|tar|gz|png|jpe?g|gif|webp|ico|pdf|woff2?|ttf|otf|mp4|mp3|wav)$/i.test(p);
          const blocked = files.filter(protectedPath);
          if (blocked.length) throw new Error(`AUTO PATCH changed protected paths: ${blocked.join(', ')}`);
          console.log(JSON.stringify({ status: 'PASS', changedFiles: files }, null, 2));
          NODE

      - name: Run application tests and GARP controls
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run build:school-server
          npm run qa:secrets
          npm run qa:garp25:sw
          npm run qa:garp25:vendored
          npm run qa:garp25:sbom

      - name: Remove test-generated trusted outputs
        shell: bash
        run: |
          set -euo pipefail
          git restore --worktree --staged -- security dist dist-school-server 2>/dev/null || true
          git restore --worktree --staged -- package.json package-lock.json 2>/dev/null || true
          git status --short
          test -n "$(git status --porcelain)" || { echo 'No source patch remains after tests'; exit 1; }

      - name: Commit candidate patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ghrab-auto-patch[bot]"
          git config user.email "ghrab-auto-patch[bot]@users.noreply.github.com"
          git add -A
          git commit -m "AUTO PATCH candidate ${{ github.run_id }}"

      - name: Independent patch safety guard
        shell: bash
        run: node scripts/auto-patch-guard.mjs origin/main HEAD

      - name: Push isolated patch branch
        shell: bash
        env:
          PUSH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --set-upstream origin "HEAD:${BRANCH}"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Open pull request
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          title="[AUTO PATCH] AI Akademie candidate"
          body_file="${RUNNER_TEMP}/auto-patch-pr.md"
          {
            echo "Automated constrained patch candidate."
            echo
            echo "- Source run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            if [ -n "${ISSUE_NUMBER:-}" ]; then echo "- Authorized issue: #${ISSUE_NUMBER}"; fi
            echo "- Model: ${AUTO_PATCH_MODEL}"
            echo "- Direct push to main: disabled by design"
            echo "- GARP/control-plane and test tooling: protected from the patch worker"
            echo
            echo "This PR still requires the independent PR validation workflow and human review before merge. A full signed AUTO-PATCH-PREP release chain is created only by the trusted release/signing path, not by the AI worker."
          } > "$body_file"
          url=$(gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$body_file")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Link PR back to authorized issue
        if: github.event_name == 'issues'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: gh issue comment "$ISSUE_NUMBER" --body "AUTO PATCH created a constrained candidate PR: $PR_URL"
