name: Safe Promotion controller

on:
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ["AI Akademie P5 release gate"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: safe-promotion-${{ github.event.workflow_run.head_branch || github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  candidate-to-main:
    name: candidate-to-main
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.2
      - name: Enforce Safe Promotion topology
        env:
          SAFE_PROMOTION_HEAD: ${{ github.head_ref }}
          SAFE_PROMOTION_BASE: ${{ github.base_ref }}
        run: node scripts/qa-safe-promotion.mjs
      - name: Verify promotion credential
        shell: bash
        env:
          SAFE_PROMOTION_TOKEN: ${{ secrets.SAFE_PROMOTION_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${SAFE_PROMOTION_TOKEN:-}" || { echo "::error::Missing SAFE_PROMOTION_TOKEN. Promotion is fail-closed."; exit 1; }
      - name: Verify N5 fail-closed controls
        run: node security/garp25/tools/selftest-garp251.mjs
      - name: Verify pinned workflow inputs
        run: node scripts/qa-garp25-pinned-inputs.mjs

  open-promotion-pr:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify candidate head and open or reuse promotion PR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SAFE_PROMOTION_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo "::error::Missing SAFE_PROMOTION_TOKEN. Promotion is fail-closed."; exit 1; }
          remote_candidate="$(gh api "repos/${REPOSITORY}/git/ref/heads/candidate" --jq '.object.sha')"
          if [ "$remote_candidate" != "$CHECKED_SHA" ]; then echo "Candidate advanced after this P5 run; stale GREEN ignored."; exit 0; fi
          changed_files="$(gh api "repos/${REPOSITORY}/compare/main...candidate" --jq '.files | length')"
          if [ "$changed_files" = "0" ]; then echo "Candidate has no delta against main; safe NO-OP."; exit 0; fi
          existing="$(gh pr list --repo "$REPOSITORY" --state open --base main --head candidate --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then echo "Promotion PR #${existing} already exists."; exit 0; fi
          gh pr create --repo "$REPOSITORY" --base main --head candidate --title "chore: safe promotion ${CHECKED_SHA:0:12}" --body "Automated Safe Promotion from durable candidate after GREEN candidate P5. Candidate SHA: ${CHECKED_SHA}."

  merge-promotion-pr:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Merge only verified candidate to protected main
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SAFE_PROMOTION_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo "::error::Missing SAFE_PROMOTION_TOKEN. Merge blocked."; exit 1; }
          pr_number="$(gh api "repos/${REPOSITORY}/commits/${CHECKED_SHA}/pulls" --jq '[.[] | select(.state == "open" and .base.ref == "main" and .head.ref == "candidate")][0].number // empty')"
          if [ -z "$pr_number" ]; then echo "No canonical candidate -> main PR for this GREEN run; safe NO-OP."; exit 0; fi
          pr_json="$(gh api "repos/${REPOSITORY}/pulls/${pr_number}")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          if [ "$head_sha" != "$CHECKED_SHA" ]; then echo "PR head moved; stale GREEN ignored."; exit 0; fi
          remote_candidate="$(gh api "repos/${REPOSITORY}/git/ref/heads/candidate" --jq '.object.sha')"
          if [ "$remote_candidate" != "$CHECKED_SHA" ]; then echo "Candidate moved; stale GREEN ignored."; exit 0; fi
          branch_json="$(gh api "repos/${REPOSITORY}/branches/main")"
          [ "$(jq -r '.protected' <<<"$branch_json")" = "true" ] || { echo "::error::main is not protected."; exit 1; }
          rules_json="$(gh api "repos/${REPOSITORY}/rules/branches/main")"
          for required_type in pull_request required_status_checks deletion non_fast_forward; do
            jq -e --arg t "$required_type" '[.[] | select(.type == $t)] | length > 0' <<<"$rules_json" >/dev/null || { echo "::error::main Ruleset missing ${required_type}."; exit 1; }
          done
          for required_check in candidate-to-main p5-release-gate garp27-trusted-admission; do
            jq -e --arg c "$required_check" '[.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[]? | select(.context == $c)] | length > 0' <<<"$rules_json" >/dev/null || { echo "::error::main Ruleset does not require ${required_check}."; exit 1; }
          done
          checks_json="$(gh api -H 'Accept: application/vnd.github+json' "repos/${REPOSITORY}/commits/${CHECKED_SHA}/check-runs")"
          for required_check in candidate-to-main p5-release-gate; do
            jq -e --arg c "$required_check" '[.check_runs[] | select(.name == $c and .conclusion == "success")] | length > 0' <<<"$checks_json" >/dev/null || { echo "::error::Required ${required_check} is not GREEN."; exit 1; }
          done
          trusted_state=''
          for attempt in {1..60}; do
            trusted_state="$(gh api "repos/${REPOSITORY}/commits/${CHECKED_SHA}/statuses" --jq '[.[] | select(.context == "garp27-trusted-admission")][0].state // empty')"
            if [ "$trusted_state" = 'success' ]; then break; fi
            if [ "$trusted_state" = 'failure' ] || [ "$trusted_state" = 'error' ]; then
              echo "::error::GARP 2.7 trusted admission is ${trusted_state}."; exit 1
            fi
            sleep 10
          done
          [ "$trusted_state" = 'success' ] || { echo "::error::GARP 2.7 trusted admission did not reach success."; exit 1; }
          result="$(gh api --method PUT "repos/${REPOSITORY}/pulls/${pr_number}/merge" -f sha="$CHECKED_SHA" -f merge_method='merge')"
          [ "$(jq -r '.merged' <<<"$result")" = "true" ] || { echo "::error::GitHub refused merge."; exit 1; }
          merge_sha="$(jq -r '.sha' <<<"$result")"
          gh api --method PATCH "repos/${REPOSITORY}/git/refs/heads/candidate" -f sha="$merge_sha" -F force=false >/dev/null
          echo "Safe Promotion merged PR #${pr_number} and fast-forwarded candidate to ${merge_sha}."
