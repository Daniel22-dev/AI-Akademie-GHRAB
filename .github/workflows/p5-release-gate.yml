name: AI Akademie P5 release gate

on:
  workflow_dispatch:
  push:
    branches: [candidate, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  p5-release-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.2
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Set deterministic build time
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Run application regression suite
        run: npm test
      - name: Run GARP 2.5.1 tooling selftest including N5
        run: npm run qa:garp25:tooling
      - name: Verify workflow supply-chain policy
        run: npm run qa:garp25:pinned
      - name: Scan source secrets
        run: npm run qa:secrets
      - name: Build clean Pages artifact
        run: npm run build:pages
      - name: Scan deployment artifact
        run: npm run qa:garp25:deployment
      - name: Verify service-worker security freeze
        run: npm run qa:garp25:sw-pages
      - name: Verify vendored consistency
        run: npm run qa:garp25:vendored
      - name: Generate deterministic SBOM
        run: npm run qa:garp25:sbom
      - name: Verify Safe Promotion topology
        run: npm run qa:safe-promotion
      - name: Build current release evidence
        env:
          GHRAB_SOURCE_COMMIT: ${{ github.sha }}
          GHRAB_BUILD_ID: p5-${{ github.run_id }}-${{ github.run_attempt }}
          GHRAB_ENVIRONMENT: PREP-PUBLIC-PAGES
        run: npm run qa:current-evidence
      - name: Upload current P5 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai-akademie-p5-${{ github.sha }}
          path: |
            qa-results/release-current/**
            security/sbom/ai-akademie-1.4.10.cdx.json
          if-no-files-found: ignore
