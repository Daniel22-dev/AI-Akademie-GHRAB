name: AUTO PATCH Validate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  validate:
    if: startsWith(github.head_ref, 'auto-patch/')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Fetch trusted main
        shell: bash
        run: git fetch --no-tags origin main

      - name: Independent patch safety guard
        shell: bash
        run: node scripts/auto-patch-guard.mjs origin/main HEAD

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Application regression tests
        run: npm test

      - name: Application-bound GARP controls
        shell: bash
        run: |
          set -euo pipefail
          npm run build:school-server
          npm run qa:secrets
          npm run qa:garp25:sw
          npm run qa:garp25:vendored
          npm run qa:garp25:sbom

      - name: Confirm candidate did not alter trusted controls
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git diff --name-only origin/main...HEAD)
          blocked=$(printf '%s\n' "$changed" | grep -E '^(\.github/|security/|scripts/|dist/|dist-school-server/|package\.json$|package-lock\.json$)' || true)
          if [ -n "$blocked" ]; then
            echo "Protected paths changed by candidate:"
            printf '%s\n' "$blocked"
            exit 1
          fi
